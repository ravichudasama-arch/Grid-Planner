/* ============================== DATE UTILS ============================== */

function pad(n) { return String(n).padStart(2, "0"); }
function toISODate(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fromISODate(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const nd = new Date(d); nd.setDate(nd.getDate() + n); return nd; }
function startOfWeek(d) { const nd = new Date(d); const day = nd.getDay(); nd.setDate(nd.getDate() - day); nd.setHours(0,0,0,0); return nd; }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function isSameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function monthLabel(d) { return d.toLocaleDateString("en-US", { month: "long", year: "numeric" }); }
function weekRangeLabel(start) {
  const end = addDays(start, 6);
  const sameMonth = start.getMonth() === end.getMonth();
  const startStr = start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const endStr = end.toLocaleDateString("en-US", sameMonth ? { day: "numeric", year: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
  return `${startStr} \u2013 ${endStr}`;
}
function formatTime(t) {
  if (!t) return "";
  const [h, m] = t.split(":").map(Number);
  const period = h >= 12 ? "PM" : "AM";
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}:${pad(m)} ${period}`;
}
function getWeekDays(anchor) {
  const start = startOfWeek(anchor);
  return Array.from({ length: 7 }, (_, i) => addDays(start, i));
}
function getMonthGrid(anchor) {
  const first = startOfMonth(anchor);
  const gridStart = startOfWeek(first);
  return Array.from({ length: 42 }, (_, i) => addDays(gridStart, i));
}

    case "instagram": return <svg {...common}><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1" fill={meta.color} stroke="none"/></svg>;

    default: return null;
  }
}

function Pill({ children, color, tint, className = "", style = {} }) {
  return (
    <span
      className={`inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-semibold tracking-wide ${className}`}
      style={{ color, backgroundColor: tint, ...style }}
    >
      {children}
    </span>
  );
}

function Avatar({ label, color }) {
  return (
    <div className="h-8 w-8 shrink-0 rounded-full flex items-center justify-center text-[11px] font-bold text-white" style={{ backgroundColor: color }}>
      {label}
    </div>
  );
}

function Toast({ toasts }) {
  return (
    <div className="fixed bottom-6 right-6 z-[80] flex flex-col gap-2 items-end">
      {toasts.map((t) => (
        <div key={t.id} className={`toast-in flex items-center gap-2 rounded-lg border px-4 py-2.5 text-sm shadow-md bg-surface ${t.tone === "error" ? "border-red-200 text-red-700" : "border-border text-ink"}`}>
          {t.tone === "error" ? <Icon name="alert" size={15} /> : <Icon name="check" size={15} className="text-emerald-600" />}
          <span>{t.message}</span>
        </div>
      ))}
    </div>
  );
}

/* ============================== FILTER BAR ============================== */

function MultiSelectPopover({ label, options, selected, onChange, renderOption }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);
  const count = selected.length;
  return (
    <div className="relative" ref={ref}>
      <button
        onClick={() => setOpen((o) => !o)}
        className={`flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-[13px] font-medium transition-colors ${
          count > 0 ? "border-brand/30 bg-brandTint text-brand" : "border-border bg-surface text-muted hover:text-ink hover:border-ink/20"
        }`}
      >
        {label}
        {count > 0 && <span className="rounded-full bg-brand text-white text-[10px] font-bold px-1.5 py-0.5 leading-none">{count}</span>}
        <Icon name="chevronRight" size={12} className="rotate-90" />
      </button>
      {open && (
        <div className="absolute left-0 mt-1.5 w-56 rounded-lg border border-border bg-surface shadow-lg p-1.5 z-30">
          {options.map((opt) => {
            const isSel = selected.includes(opt.value);
            return (
              <button
                key={opt.value}
                onClick={() => {
                  onChange(isSel ? selected.filter((v) => v !== opt.value) : [...selected, opt.value]);
                }}
                className="w-full flex items-center gap-2 rounded-md px-2.5 py-1.5 text-[13px] text-left hover:bg-paper"
              >
                <span className={`h-4 w-4 rounded flex items-center justify-center border ${isSel ? "bg-brand border-brand" : "border-border"}`}>
                  {isSel && <Icon name="check" size={11} className="text-white" />}
                </span>
                {renderOption ? renderOption(opt) : opt.label}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function SelectFilter({ label, value, options, onChange }) {
  return (
    <div className="relative">
      <select
        value={value}
        onChange={(e) => onChange(e.target.value)}
        className={`appearance-none rounded-md border pl-3 pr-7 py-1.5 text-[13px] font-medium cursor-pointer transition-colors ${
          value ? "border-brand/30 bg-brandTint text-brand" : "border-border bg-surface text-muted hover:text-ink hover:border-ink/20"
        }`}
      >
        <option value="">{label}</option>
        {options.map((o) => <option key={o} value={o}>{o}</option>)}
      </select>
      <Icon name="chevronRight" size={12} className="rotate-90 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" />
    </div>
  );
}

function FilterBar({ filters, setFilters, campaigns, contentTypeOptions, resultCount, totalCount }) {
  const hasActive = filters.status.length > 0 || filters.campaign || filters.contentType;
  return (
    <div className="flex flex-wrap items-center gap-2 px-6 py-3 border-b border-border bg-surface">
      <div className="flex items-center gap-1.5 text-muted text-[13px] font-medium mr-1">
        <Icon name="filter" size={14} />
        Filter
      </div>
      <MultiSelectPopover
        label="Status"
        selected={filters.status}
        onChange={(v) => setFilters((f) => ({ ...f, status: v }))}
        options={STATUSES.map((s) => ({ value: s, label: STATUS_META[s].label }))}
        renderOption={(opt) => (
          <span className="flex items-center gap-2">
            <span className="h-2 w-2 rounded-full" style={{ backgroundColor: STATUS_META[opt.value].color }} />
            {opt.label}

      <SelectFilter label="Campaign" value={filters.campaign} options={campaigns} onChange={(v) => setFilters((f) => ({ ...f, campaign: v }))} />
      <SelectFilter label="Content type" value={filters.contentType} options={contentTypeOptions} onChange={(v) => setFilters((f) => ({ ...f, contentType: v }))} />
      {hasActive && (
        <button
          onClick={() => setFilters((f) => ({ ...f, status: [], campaign: "", contentType: "" }))}
          className="flex items-center gap-1 text-[13px] font-medium text-muted hover:text-ink px-2 py-1.5"
        >
          <Icon name="x" size={13} />
          Clear

      <div className="ml-auto text-[12.5px] text-muted font-mono">
        {resultCount} of {totalCount} posts
      </div>
    </div>
  );

/* ============================== CONTENT CARD ============================== */

function typeGlyph(type) {
  const t = (type || "").toLowerCase();
  if (t.includes("video") || t.includes("reel") || t.includes("short") || t.includes("live")) return "play";
  if (t.includes("carousel")) return "grid";
  if (t.includes("poll")) return "chart";
  if (t.includes("article")) return "list";
  return "image";
}

function ContentCard({ post, dense, onEdit, onDuplicate, onDelete, dragHandlers, isDragging, isDropTarget }) {
  const pm = PLATFORM_META[post.platform];
  const sm = STATUS_META[post.status];
  const [menuOpen, setMenuOpen] = useState(false);
  const menuRef = useRef(null);
  useEffect(() => {
    function onDoc(e) { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); }
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, []);

  if (dense) {
    return (
      <div
        {...dragHandlers}
        onClick={() => onEdit(post)}
        className={`group flex items-center gap-1.5 rounded-md border bg-surface px-2 py-1 cursor-pointer hover:border-ink/25 transition-colors ${isDragging ? "opacity-40" : ""} ${isDropTarget ? "ring-2 ring-brand" : "border-border"}`}
        style={{ borderLeftWidth: 3, borderLeftColor: pm.color }}
      >
        <span className="h-1.5 w-1.5 rounded-full shrink-0" style={{ backgroundColor: sm.color }} />
        <span className="text-[11.5px] font-mono text-muted shrink-0">{formatTime(post.time).replace(" ", "")}</span>
        <span className="text-[12px] text-ink truncate flex-1">{post.title}</span>
      </div>
    );
  }

  return (
    <div
      {...dragHandlers}
      className={`group relative rounded-lg border bg-surface p-3 cursor-grab active:cursor-grabbing transition-all hover:shadow-sm ${isDragging ? "opacity-40" : ""} ${isDropTarget ? "ring-2 ring-brand" : "border-border"}`}
      style={{ borderLeftWidth: 4, borderLeftColor: pm.color }}
      onClick={() => onEdit(post)}
    >
      <div className="flex items-start justify-between gap-2 mb-2">
        <div className="flex items-center gap-1.5 min-w-0">
          <PlatformIcon platform={post.platform} size={13} />
          <span className="text-[11px] font-mono uppercase tracking-wider text-muted">{formatTime(post.time)}</span>
        </div>
        <div className="relative" ref={menuRef}>
          <button
            onClick={(e) => { e.stopPropagation(); setMenuOpen((o) => !o); }}
            className="opacity-0 group-hover:opacity-100 focus:opacity-100 h-6 w-6 rounded flex items-center justify-center text-muted hover:bg-paper hover:text-ink transition-opacity"
            aria-label="Card actions"
          >
            <span className="text-[15px] leading-none tracking-widest">{"\u22ef"}</span>
          </button>
          {menuOpen && (
            <div className="absolute right-0 mt-1 w-36 rounded-lg border border-border bg-surface shadow-lg py-1 z-30">
              <button onClick={(e) => { e.stopPropagation(); setMenuOpen(false); onEdit(post); }} className="w-full flex items-center gap-2 px-3 py-1.5 text-[13px] text-ink hover:bg-paper text-left"><Icon name="edit" size={13}/>Edit</button>
              <button onClick={(e) => { e.stopPropagation(); setMenuOpen(false); onDuplicate(post); }} className="w-full flex items-center gap-2 px-3 py-1.5 text-[13px] text-ink hover:bg-paper text-left"><Icon name="copy" size={13}/>Duplicate</button>
              <button onClick={(e) => { e.stopPropagation(); setMenuOpen(false); onDelete(post); }} className="w-full flex items-center gap-2 px-3 py-1.5 text-[13px] text-red-600 hover:bg-red-50 text-left"><Icon name="trash" size={13}/>Delete</button>
            </div>
          )}
        </div>
      </div>

      <div className="h-20 rounded-md mb-2.5 flex items-center justify-center overflow-hidden" style={{ backgroundColor: pm.tint }}>
        {post.thumbnail ? (
          <img src={post.thumbnail} alt="" className="h-full w-full object-cover" onError={(e) => { e.target.style.display = "none"; }} />
        ) : (
          <Icon name={typeGlyph(post.contentType)} size={22} className="opacity-40" style={{ color: pm.color }} />
        )}
      </div>

      <p className="text-[13.5px] font-semibold text-ink leading-snug mb-1 line-clamp-2">{post.title}</p>
      <p className="text-[12px] text-muted leading-snug mb-2.5 line-clamp-2">{post.caption}</p>

      <div className="flex items-center justify-between gap-2">
        <Pill color={sm.color} tint={sm.tint}>{sm.label}</Pill>

      {post.campaign && (
        <div className="mt-2 pt-2 border-t border-border/70 flex items-center gap-1 text-[11px] text-muted">
          <Icon name="tag" size={11} />
          <span className="truncate">{post.campaign}</span>
        </div>
      )}
    </div>
  );
}

/* ============================== DAY CELL ============================== */

function DayCell({ date, posts, dense, isToday, dragState, onDrop, onCardDragOver, onEdit, onDuplicate, onDelete, onQuickAdd }) {
  const [isOver, setIsOver] = useState(false);
  const sorted = [...posts].sort((a, b) => a.order - b.order);

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setIsOver(true); }}
      onDragLeave={() => setIsOver(false)}
      onDrop={(e) => { e.preventDefault(); setIsOver(false); onDrop(date, null); }}
      className={`flex flex-col h-full min-h-[120px] transition-colors ${isOver ? "bg-brandTint/60" : ""}`}
    >
      <div className={`flex items-center justify-between px-2.5 py-2 shrink-0 ${dense ? "" : "border-b border-border/70"}`}>
        <span className={`text-[12px] font-mono ${isToday ? "text-brand font-bold" : "text-muted"}`}>
          {dense ? date.getDate() : date.toLocaleDateString("en-US", { weekday: "short", day: "numeric" })}
        </span>
        {isToday && <span className="h-1.5 w-1.5 rounded-full bg-brand" />}
      </div>
      <div className={`flex-1 flex flex-col gap-1.5 px-2 py-2 overflow-y-auto ${dense ? "gap-1" : ""}`}>
        {sorted.map((post) => (
          <ContentCard
            key={post.id}
            post={post}
            dense={dense}
            onEdit={onEdit}
            onDuplicate={onDuplicate}
            onDelete={onDelete}
            isDragging={dragState.draggingId === post.id}
            isDropTarget={dragState.overId === post.id}
            dragHandlers={{
              draggable: true,
              onDragStart: (e) => { e.stopPropagation(); e.dataTransfer.effectAllowed = "move"; dragState.setDraggingId(post.id); },
              onDragEnd: () => { dragState.setDraggingId(null); dragState.setOverId(null); },
              onDragOver: (e) => { e.preventDefault(); e.stopPropagation(); if (dragState.draggingId && dragState.draggingId !== post.id) dragState.setOverId(post.id); },
              onDrop: (e) => { e.preventDefault(); e.stopPropagation(); onDrop(date, post.id); },
            }}
          />
        ))}
        {sorted.length === 0 && (
          <button
            onClick={() => onQuickAdd(date)}
            className="flex items-center justify-center gap-1 rounded-md border border-dashed border-border text-muted text-[11.5px] py-2.5 opacity-0 group-hover:opacity-100 hover:opacity-100 hover:border-brand/40 hover:text-brand transition-all"
          >
            <Icon name="plus" size={12} /> Add
          </button>
        )}
      </div>
      {sorted.length > 0 && !dense && (
        <button onClick={() => onQuickAdd(date)} className="mx-2 mb-2 flex items-center justify-center gap-1 rounded-md text-muted text-[11px] py-1 hover:text-brand transition-colors">
          <Icon name="plus" size={11} /> Add
        </button>
      )}
    </div>
  );
}

/* ============================== CALENDAR GRID ============================== */

const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function CalendarGrid({ mode, anchorDate, postsByDay, onDrop, onEdit, onDuplicate, onDelete, onQuickAdd }) {
  const [draggingId, setDraggingId] = useState(null);
  const [overId, setOverId] = useState(null);
  const dragState = { draggingId, setDraggingId, overId, setOverId };
  const today = new Date();

  if (mode === "week") {
    const days = getWeekDays(anchorDate);
    return (
      <div className="flex-1 grid grid-cols-7 divide-x divide-border overflow-hidden">
        {days.map((date) => {
          const key = toISODate(date);
          return (
            <div key={key} className="group flex flex-col min-h-0 overflow-y-auto">
              <DayCell
                date={date}
                posts={postsByDay[key] || []}
                dense={false}
                isToday={isSameDay(date, today)}
                dragState={dragState}
                onDrop={(d, targetId) => onDrop(d, targetId, dragState.draggingId)}
                onEdit={onEdit}
                onDuplicate={onDuplicate}
                onDelete={onDelete}
                onQuickAdd={onQuickAdd}
              />
            </div>
          );
        })}
      </div>
    );
  }

  const days = getMonthGrid(anchorDate);
  const weeks = [];
  for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));

  return (
    <div className="flex-1 flex flex-col overflow-y-auto">
      <div className="grid grid-cols-7 border-b border-border shrink-0">
        {WEEKDAY_LABELS.map((w) => (
          <div key={w} className="px-2.5 py-2 text-[11px] font-mono uppercase tracking-wider text-muted text-center">{w}</div>
        ))}
      </div>
      <div className="flex-1 grid" style={{ gridTemplateRows: `repeat(${weeks.length}, minmax(110px, 1fr))` }}>
        {weeks.map((week, wi) => (
          <div key={wi} className="grid grid-cols-7 divide-x divide-border border-b border-border">
            {week.map((date) => {
              const key = toISODate(date);
              const inMonth = date.getMonth() === anchorDate.getMonth();
              return (
                <div key={key} className={`group flex flex-col min-h-0 ${inMonth ? "" : "bg-paper/60"}`}>
                  <DayCell
                    date={date}
                    posts={postsByDay[key] || []}
                    dense
                    isToday={isSameDay(date, today)}
                    dragState={dragState}
                    onDrop={(d, targetId) => onDrop(d, targetId, dragState.draggingId)}
                    onEdit={onEdit}
                    onDuplicate={onDuplicate}
                    onDelete={onDelete}
                    onQuickAdd={onQuickAdd}
                  />
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function DateNav({ mode, anchorDate, setAnchorDate }) {
  const label = mode === "week" ? weekRangeLabel(startOfWeek(anchorDate)) : monthLabel(anchorDate);
  const step = (dir) => {
    setAnchorDate((d) => {
      if (mode === "week") return addDays(d, dir * 7);
      const nd = new Date(d);
      nd.setMonth(nd.getMonth() + dir);
      return nd;
    });
  };
  return (
    <div className="flex items-center gap-2">
      <button onClick={() => step(-1)} className="h-8 w-8 flex items-center justify-center rounded-md border border-border text-muted hover:text-ink hover:border-ink/25" aria-label="Previous"><Icon name="chevronLeft" size={15} /></button>
      <button onClick={() => setAnchorDate(new Date())} className="rounded-md border border-border px-3 h-8 text-[13px] font-medium text-muted hover:text-ink hover:border-ink/25">Today</button>
      <button onClick={() => step(1)} className="h-8 w-8 flex items-center justify-center rounded-md border border-border text-muted hover:text-ink hover:border-ink/25" aria-label="Next"><Icon name="chevronRight" size={15} /></button>
      <span className="font-display text-[17px] text-ink ml-1 min-w-[190px]">{label}</span>
    </div>
  );
}

function YouTubePreview({ data }) {

function PlatformPreview({ data }) {
  switch (data.platform) {
    case "instagram": return <InstagramPreview data={data} />;
    case "facebook": return <FacebookPreview data={data} />;
    case "linkedin": return <LinkedInPreview data={data} />;
    case "youtube": return <YouTubePreview data={data} />;

}

/* ============================== EDITOR PANEL ============================== */

const EMPTY_POST = {
  id: null,
  platform: "instagram",
  date: toISODate(new Date()),
  time: "09:00",
  title: "",
  caption: "",
  contentType: PLATFORM_META.instagram.types[0],
  status: "idea",
  thumbnail: "",
  tags: [],
  campaign: "",
  notes: "",
  order: 0,
};

function Field({ label, hint, error, children }) {
  return (
    <div>
      <div className="flex items-baseline justify-between mb-1.5">
        <label className="text-[12.5px] font-semibold text-ink">{label}</label>
        {hint && <span className="text-[11px] text-muted font-mono">{hint}</span>}
      </div>
      {children}
      {error && <p className="text-[12px] text-red-600 mt-1">{error}</p>}
    </div>
  );
}

const inputClass = "w-full rounded-md border border-border bg-surface px-3 py-2 text-[13.5px] text-ink placeholder:text-muted/70 focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand/50 transition-colors";

function EditorPanel({ post, campaigns, onSave, onClose, onDelete, onDuplicate, isNew }) {
  const [form, setForm] = useState(post);
  const [errors, setErrors] = useState({});
  const [tagInput, setTagInput] = useState("");
  const [newCampaign, setNewCampaign] = useState(false);
  const panelRef = useRef(null);

  useEffect(() => { setForm(post); setErrors({}); }, [post]);

  useEffect(() => {
    function onKey(e) { if (e.key === "Escape") onClose(); }
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  const pm = PLATFORM_META[form.platform];

  function update(patch) { setForm((f) => ({ ...f, ...patch })); }

  function handlePlatformChange(p) {
    const types = PLATFORM_META[p].types;
    update({ platform: p, contentType: types.includes(form.contentType) ? form.contentType : types[0] });
  }

  function addTag() {
    const t = tagInput.trim().replace(/^#/, "");
    if (t && !form.tags.includes(t)) update({ tags: [...form.tags, t] });
    setTagInput("");
  }

  function removeTag(t) { update({ tags: form.tags.filter((x) => x !== t) }); }

  function validate() {
    const e = {};
    if (!form.title.trim()) e.title = "Give this post a title so you can find it later.";
    if (!form.date) e.date = "Choose a publish date.";
    return e;
  }

  function handleSave() {
    const e = validate();
    if (Object.keys(e).length) { setErrors(e); return; }
    onSave(form);
  }

  return (
    <div className="fixed inset-0 z-[60] flex justify-end">
      <div className="absolute inset-0 bg-ink/25" onClick={onClose} />
      <div ref={panelRef} className="relative w-full max-w-[880px] h-full bg-surface shadow-2xl flex flex-col animate-slide-in">
        <div className="flex items-center justify-between px-6 h-16 border-b border-border shrink-0">
          <div>
            <p className="font-display text-[18px] text-ink">{isNew ? "New content" : "Edit content"}</p>
            <p className="text-[12px] text-muted">{isNew ? "Add a post to your planner" : `Editing \u201c${post.title || "Untitled"}\u201d`}</p>
          </div>
          <div className="flex items-center gap-2">
            {!isNew && (
              <>
                <button onClick={() => onDuplicate(form)} className="flex items-center gap-1.5 rounded-md border border-border px-3 py-1.5 text-[13px] font-medium text-muted hover:text-ink hover:border-ink/25 transition-colors">
                  <Icon name="copy" size={13} /> Duplicate
                </button>
                <button onClick={() => onDelete(form)} className="flex items-center gap-1.5 rounded-md border border-border px-3 py-1.5 text-[13px] font-medium text-red-600 hover:bg-red-50 hover:border-red-200 transition-colors">
                  <Icon name="trash" size={13} /> Delete
                </button>
              </>
            )}
            <button onClick={onClose} className="h-8 w-8 flex items-center justify-center rounded-md text-muted hover:text-ink hover:bg-paper transition-colors" aria-label="Close"><Icon name="x" size={17} /></button>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto">
          <div className="grid md:grid-cols-[1fr_340px] gap-8 p-6">
            <div className="flex flex-col gap-5 min-w-0">
              <Field label="Platform">
                <div className="flex flex-wrap gap-2">
                  {PLATFORMS.map((p) => (
                    <button
                      key={p}
                      onClick={() => handlePlatformChange(p)}
                      className={`flex items-center gap-1.5 rounded-md border px-3 py-1.5 text-[13px] font-medium transition-colors ${
                        form.platform === p ? "border-transparent text-white" : "border-border text-muted hover:text-ink"
                      }`}
                      style={form.platform === p ? { backgroundColor: PLATFORM_META[p].color } : {}}
                    >
                      <PlatformIcon platform={p} size={13} />
                      {PLATFORM_META[p].label}
                    </button>
                  ))}
                </div>
              </Field>

              <Field label="Title / topic" error={errors.title}>
                <input
                  className={inputClass}
                  placeholder="e.g. Fall collection teaser"
                  value={form.title}
                  onChange={(e) => update({ title: e.target.value })}
                />
              </Field>

              <Field label="Caption / post copy" hint={`${form.caption.length} / ${pm.captionLimit}`}>
                <textarea
                  className={inputClass + " min-h-[110px] resize-y"}
                  placeholder="Write the copy that will publish with this post\u2026"
                  value={form.caption}
                  onChange={(e) => update({ caption: e.target.value.slice(0, pm.captionLimit) })}
                />
              </Field>

              <div className="grid grid-cols-2 gap-4">
                <Field label="Content type">
                  <select className={inputClass} value={form.contentType} onChange={(e) => update({ contentType: e.target.value })}>
                    {pm.types.map((t) => <option key={t} value={t}>{t}</option>)}
                  </select>
                </Field>
                <Field label="Status">
                  <select className={inputClass} value={form.status} onChange={(e) => update({ status: e.target.value })}>
                    {STATUSES.map((s) => <option key={s} value={s}>{STATUS_META[s].label}</option>)}
                  </select>
                </Field>
              </div>

              <div className="grid grid-cols-2 gap-4">
                <Field label="Publish date" error={errors.date}>
                  <input type="date" className={inputClass} value={form.date} onChange={(e) => update({ date: e.target.value })} />
                </Field>
                <Field label="Publish time">
                  <input type="time" className={inputClass} value={form.time} onChange={(e) => update({ time: e.target.value })} />
                </Field>
              </div>

              <Field label="Media thumbnail" hint="optional">
                <div className="flex items-center gap-3">
                  <div className="h-14 w-14 shrink-0 rounded-md flex items-center justify-center overflow-hidden" style={{ backgroundColor: pm.tint }}>
                    {form.thumbnail ? (
                      <img src={form.thumbnail} className="h-full w-full object-cover" onError={(e) => { e.target.style.display = "none"; }} />
                    ) : (
                      <Icon name="image" size={18} style={{ color: pm.color }} className="opacity-50" />
                    )}
                  </div>
                  <input
                    className={inputClass}
                    placeholder="Paste an image URL"
                    value={form.thumbnail}
                    onChange={(e) => update({ thumbnail: e.target.value })}
                  />
                </div>
              </Field>

              <div className="grid grid-cols-2 gap-4">
                <Field label="Campaign">
                  {newCampaign ? (
                    <input
                      autoFocus
                      className={inputClass}
                      placeholder="New campaign name"
                      value={form.campaign}
                      onChange={(e) => update({ campaign: e.target.value })}
                      onBlur={() => { if (!form.campaign.trim()) setNewCampaign(false); }}
                    />
                  ) : (
                    <select
                      className={inputClass}
                      value={form.campaign}
                      onChange={(e) => { if (e.target.value === "__new") { setNewCampaign(true); update({ campaign: "" }); } else update({ campaign: e.target.value }); }}
                    >
                      <option value="">No campaign</option>
                      {campaigns.map((c) => <option key={c} value={c}>{c}</option>)}
                      <option value="__new">+ New campaign\u2026</option>
                    </select>
                  )}
                </Field>
                <Field label="Tags">
                  <div className="flex gap-2">
                    <input
                      className={inputClass}
                      placeholder="Add a tag, press Enter"
                      value={tagInput}
                      onChange={(e) => setTagInput(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addTag(); } }}
                    />
                  </div>
                </Field>
              </div>
              {form.tags.length > 0 && (
                <div className="flex flex-wrap gap-1.5 -mt-3">
                  {form.tags.map((t) => (
                    <span key={t} className="flex items-center gap-1 rounded-full bg-paper border border-border px-2.5 py-1 text-[11.5px] text-ink">
                      #{t}
                      <button onClick={() => removeTag(t)} className="text-muted hover:text-ink"><Icon name="x" size={10} /></button>
                    </span>
                  ))}
                </div>
              )}

              <Field label="Notes" hint="internal only">
                <textarea
                  className={inputClass + " min-h-[70px] resize-y"}
                  placeholder="Production notes, shot lists, links to assets\u2026"
                  value={form.notes}
                  onChange={(e) => update({ notes: e.target.value })}
                />
              </Field>
            </div>

            <div className="md:sticky md:top-0 h-fit">
              <PlatformPreview data={form} />
            </div>
          </div>
        </div>

        <div className="flex items-center justify-end gap-2 px-6 py-4 border-t border-border shrink-0">
          <button onClick={onClose} className="rounded-md px-4 py-2 text-[13.5px] font-medium text-muted hover:text-ink hover:bg-paper transition-colors">Cancel</button>
          <button onClick={handleSave} className="rounded-md bg-brand text-white px-4 py-2 text-[13.5px] font-semibold hover:bg-brandDark transition-colors shadow-sm">
            {isNew ? "Add to planner" : "Save changes"}
          </button>
        </div>
      </div>
    </div>
  );
}

/* ============================== CONTENT LIST VIEW ============================== */

const LIST_COLUMNS = [
  { key: "platform", label: "Platform" },
  { key: "title", label: "Title" },
  { key: "contentType", label: "Type" },
  { key: "status", label: "Status" },
  { key: "date", label: "Date" },
  { key: "campaign", label: "Campaign" },
];

function ContentListView({ posts, onEdit, onDuplicate, onDelete, onClearFilters, hasFilters }) {
  const [sortKey, setSortKey] = useState("date");
  const [sortDir, setSortDir] = useState("asc");

  const sorted = useMemo(() => {
    const copy = [...posts];
    copy.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (sortKey === "date") { av = a.date + a.time; bv = b.date + b.time; }
      av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return copy;
  }, [posts, sortKey, sortDir]);

  function toggleSort(key) {
    if (sortKey === key) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortKey(key); setSortDir("asc"); }
  }

  if (posts.length === 0) {
    return <EmptyState title="No content matches these filters" message="Try widening your filters, or create a new post to get started." actionLabel={hasFilters ? "Clear filters" : undefined} onAction={onClearFilters} />;
  }

  return (
    <div className="flex-1 overflow-auto px-6 py-5">
      <div className="rounded-lg border border-border overflow-hidden">
        <table className="w-full text-left border-collapse">
          <thead>
            <tr className="bg-paper border-b border-border">
              {LIST_COLUMNS.map((col) => (
                <th key={col.key} className="px-4 py-2.5 text-[11.5px] font-mono uppercase tracking-wider text-muted select-none">
                  <button onClick={() => toggleSort(col.key)} className="flex items-center gap-1 hover:text-ink transition-colors">
                    {col.label}
                    {sortKey === col.key && <Icon name="chevronRight" size={11} className={sortDir === "asc" ? "-rotate-90" : "rotate-90"} />}
                  </button>
                </th>
              ))}
              <th className="px-4 py-2.5"></th>
            </tr>
          </thead>
          <tbody>
            {sorted.map((post) => {
              const pm = PLATFORM_META[post.platform];
              const sm = STATUS_META[post.status];
              return (
                <tr key={post.id} onClick={() => onEdit(post)} className="border-b border-border last:border-0 hover:bg-paper/70 cursor-pointer transition-colors">
                  <td className="px-4 py-3">
                    <span className="flex items-center gap-1.5 text-[13px] text-ink"><PlatformIcon platform={post.platform} size={13} />{pm.label}</span>
                  </td>
                  <td className="px-4 py-3 text-[13px] text-ink font-medium max-w-[240px] truncate">{post.title}</td>
                  <td className="px-4 py-3 text-[12.5px] text-muted font-mono">{post.contentType}</td>
                  <td className="px-4 py-3"><Pill color={sm.color} tint={sm.tint}>{sm.label}</Pill></td>
                  <td className="px-4 py-3 text-[12.5px] text-muted font-mono">{fromISODate(post.date).toLocaleDateString("en-US", { month: "short", day: "numeric" })} \u00b7 {formatTime(post.time)}</td>
                  <td className="px-4 py-3 text-[12.5px] text-muted truncate max-w-[160px]">{post.campaign || "\u2014"}</td>
                  <td className="px-4 py-3">
                    <div className="flex items-center justify-end gap-1">
                      <button onClick={(e) => { e.stopPropagation(); onDuplicate(post); }} className="h-7 w-7 flex items-center justify-center rounded text-muted hover:text-ink hover:bg-paper" aria-label="Duplicate"><Icon name="copy" size={13} /></button>
                      <button onClick={(e) => { e.stopPropagation(); onDelete(post); }} className="h-7 w-7 flex items-center justify-center rounded text-muted hover:text-red-600 hover:bg-red-50" aria-label="Delete"><Icon name="trash" size={13} /></button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================== ANALYTICS VIEW ============================== */

function Bar({ label, value, max, color }) {
  const pct = max ? Math.round((value / max) * 100) : 0;
  return (
    <div className="flex items-center gap-3">
      <span className="w-32 shrink-0 text-[13px] text-ink truncate">{label}</span>
      <div className="flex-1 h-2 rounded-full bg-paper overflow-hidden">
        <div className="h-full rounded-full" style={{ width: `${pct}%`, backgroundColor: color }} />
      </div>
      <span className="w-6 shrink-0 text-[12.5px] font-mono text-muted text-right">{value}</span>
    </div>
  );
}

function AnalyticsView({ posts }) {
  const today = new Date();
  const in7 = addDays(today, 7);

  const byPlatform = PLATFORMS.map((p) => ({ key: p, label: PLATFORM_META[p].label, color: PLATFORM_META[p].color, value: posts.filter((x) => x.platform === p).length }));
  const byStatus = STATUSES.map((s) => ({ key: s, label: STATUS_META[s].label, color: STATUS_META[s].color, value: posts.filter((x) => x.status === s).length }));
  const upcoming = posts
    .filter((p) => { const d = fromISODate(p.date); return d >= new Date(today.getFullYear(), today.getMonth(), today.getDate()) && d <= in7 && p.status !== "published"; })
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  const maxPlatform = Math.max(1, ...byPlatform.map((x) => x.value));
  const maxStatus = Math.max(1, ...byStatus.map((x) => x.value));

  const campaignCounts = {};
  posts.forEach((p) => { if (p.campaign) campaignCounts[p.campaign] = (campaignCounts[p.campaign] || 0) + 1; });
  const campaignList = Object.entries(campaignCounts).sort((a, b) => b[1] - a[1]);
  const maxCampaign = Math.max(1, ...campaignList.map(([, v]) => v));

  return (
    <div className="flex-1 overflow-auto px-6 py-6 max-w-[1200px] mx-auto w-full">
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div className="rounded-lg border border-border bg-surface p-4">
          <p className="text-[11px] font-mono uppercase tracking-wider text-muted mb-1">Total posts</p>
          <p className="font-display text-[26px] text-ink">{posts.length}</p>
        </div>
        <div className="rounded-lg border border-border bg-surface p-4">
          <p className="text-[11px] font-mono uppercase tracking-wider text-muted mb-1">Scheduled</p>
          <p className="font-display text-[26px] text-ink">{posts.filter((p) => p.status === "scheduled").length}</p>
        </div>
        <div className="rounded-lg border border-border bg-surface p-4">
          <p className="text-[11px] font-mono uppercase tracking-wider text-muted mb-1">Drafts &amp; ideas</p>
          <p className="font-display text-[26px] text-ink">{posts.filter((p) => p.status === "draft" || p.status === "idea").length}</p>
        </div>
        <div className="rounded-lg border border-border bg-surface p-4">
          <p className="text-[11px] font-mono uppercase tracking-wider text-muted mb-1">Published</p>
          <p className="font-display text-[26px] text-ink">{posts.filter((p) => p.status === "published").length}</p>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-6 mb-8">
        <div className="rounded-lg border border-border bg-surface p-5">
          <p className="font-display text-[16px] text-ink mb-4">By platform</p>
          <div className="flex flex-col gap-3">
            {byPlatform.map((b) => <Bar key={b.key} {...b} max={maxPlatform} />)}
          </div>
        </div>
        <div className="rounded-lg border border-border bg-surface p-5">
          <p className="font-display text-[16px] text-ink mb-4">By status</p>
          <div className="flex flex-col gap-3">
            {byStatus.map((b) => <Bar key={b.key} {...b} max={maxStatus} />)}
          </div>
        </div>
      </div>

      <div className="grid md:grid-cols-2 gap-6">
        <div className="rounded-lg border border-border bg-surface p-5">
          <p className="font-display text-[16px] text-ink mb-4">By campaign</p>
          {campaignList.length === 0 ? (
            <p className="text-[13px] text-muted">No posts have a campaign assigned yet.</p>
          ) : (
            <div className="flex flex-col gap-3">
              {campaignList.map(([name, value]) => <Bar key={name} label={name} value={value} max={maxCampaign} color="#3B3654" />)}
            </div>
          )}
        </div>
        <div className="rounded-lg border border-border bg-surface p-5">
          <p className="font-display text-[16px] text-ink mb-4">Next 7 days</p>
          {upcoming.length === 0 ? (
            <p className="text-[13px] text-muted">Nothing scheduled in the next week.</p>
          ) : (
            <div className="flex flex-col divide-y divide-border">
              {upcoming.map((p) => {
                const sm = STATUS_META[p.status];
                return (
                  <div key={p.id} className="flex items-center gap-3 py-2 first:pt-0 last:pb-0">
                    <PlatformIcon platform={p.platform} size={13} />
                    <span className="text-[13px] text-ink flex-1 truncate">{p.title}</span>
                    <span className="text-[11.5px] font-mono text-muted">{fromISODate(p.date).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span>
                    <Pill color={sm.color} tint={sm.tint}>{sm.label}</Pill>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== SETTINGS VIEW ============================== */

function SettingsView({ campaigns, setCampaigns, onResetData }) {
  const [newCampaign, setNewCampaign] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);

  function addCampaign() {
    const v = newCampaign.trim();
    if (v && !campaigns.includes(v)) setCampaigns((c) => [...c, v]);
    setNewCampaign("");
  }
  function removeCampaign(name) { setCampaigns((c) => c.filter((x) => x !== name)); }

  return (
    <div className="flex-1 overflow-auto px-6 py-6 max-w-[720px] mx-auto w-full flex flex-col gap-8">
      <section>
        <p className="font-display text-[16px] text-ink mb-1">Campaigns</p>
        <p className="text-[13px] text-muted mb-4">Group content by initiative. Campaigns show up as a filter in the planner and content list.</p>
        <div className="flex gap-2 mb-3">
          <input
            className={inputClass}
            placeholder="New campaign name"
            value={newCampaign}
            onChange={(e) => setNewCampaign(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") addCampaign(); }}
          />
          <button onClick={addCampaign} className="shrink-0 rounded-md bg-brand text-white px-4 py-2 text-[13px] font-semibold hover:bg-brandDark transition-colors">Add</button>
        </div>
        <div className="flex flex-col divide-y divide-border rounded-lg border border-border overflow-hidden">
          {campaigns.map((c) => (
            <div key={c} className="flex items-center justify-between px-4 py-2.5 bg-surface">
              <span className="text-[13.5px] text-ink">{c}</span>
              <button onClick={() => removeCampaign(c)} className="text-muted hover:text-red-600 transition-colors"><Icon name="trash" size={14} /></button>
            </div>
          ))}
          {campaigns.length === 0 && <p className="px-4 py-3 text-[13px] text-muted">No campaigns yet.</p>}
        </div>
      </section>

      <section>
        <p className="font-display text-[16px] text-ink mb-1">Platform legend</p>
        <p className="text-[13px] text-muted mb-4">Colors used throughout the planner to tell platforms apart at a glance.</p>
        <div className="grid grid-cols-2 gap-3">
          {PLATFORMS.map((p) => (
            <div key={p} className="flex items-center gap-2.5 rounded-lg border border-border px-3.5 py-2.5">
              <span className="h-3 w-3 rounded-full" style={{ backgroundColor: PLATFORM_META[p].color }} />
              <PlatformIcon platform={p} size={14} />
              <span className="text-[13.5px] text-ink">{PLATFORM_META[p].label}</span>
            </div>
          ))}
        </div>
      </section>

      <section>
        <p className="font-display text-[16px] text-ink mb-1">Data</p>
        <p className="text-[13px] text-muted mb-4">
          Contour keeps your planner in memory for this session so you can freely experiment. Changes aren't saved to a server or your device \u2014 refreshing the page will restore the sample calendar.
        </p>
        <button onClick={() => setConfirmReset(true)} className="rounded-md border border-border px-4 py-2 text-[13px] font-medium text-muted hover:text-ink hover:border-ink/25 transition-colors">
          Reset to sample data
        </button>
      </section>

      {confirmReset && (
        <ConfirmDialog
          title="Reset planner?"
          message="This replaces all current content with the original sample calendar. This can't be undone."
          confirmLabel="Reset"
          onConfirm={() => { onResetData(); setConfirmReset(false); }}
          onCancel={() => setConfirmReset(false)}
        />
      )}
    </div>
  );
}

/* ============================== SKELETON ============================== */

function PlannerSkeleton() {
  return (
    <div className="flex-1 grid grid-cols-7 divide-x divide-border">
      {Array.from({ length: 7 }).map((_, i) => (
        <div key={i} className="flex flex-col gap-2 p-3">
          <div className="h-3 w-10 rounded bg-paper" />
          {Array.from({ length: i % 3 === 0 ? 2 : 1 }).map((_, j) => (
            <div key={j} className="h-28 rounded-lg bg-paper animate-pulse-slow" />
          ))}
        </div>
      ))}
    </div>
  );
}

/* ============================== APP ============================== */

function App() {
  const [loading, setLoading] = useState(true);
  const [posts, setPosts] = useState([]);
  const [campaigns, setCampaigns] = useState(CAMPAIGNS_DEFAULT);
  const [view, setView] = useState("planner");
  const [calMode, setCalMode] = useState("week");
  const [anchorDate, setAnchorDate] = useState(new Date());
  const [platformTab, setPlatformTab] = useState("all");
  const [filters, setFilters] = useState({ status: [], campaign: "", contentType: "" });
  const [editingPost, setEditingPost] = useState(null);
  const [isNewPost, setIsNewPost] = useState(false);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [loadError, setLoadError] = useState(false);

  useEffect(() => {
    const t = setTimeout(() => {
      try {
        setPosts(seedPosts());
        setLoading(false);
      } catch (e) {
        setLoadError(true);
        setLoading(false);
      }
    }, 650);
    return () => clearTimeout(t);
  }, []);

  function pushToast(message, tone = "success") {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, message, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 2600);
  }

  const contentTypeOptions = useMemo(() => {
    if (platformTab !== "all") return PLATFORM_META[platformTab].types;
    const set = new Set();
    PLATFORMS.forEach((p) => PLATFORM_META[p].types.forEach((t) => set.add(t)));
    return Array.from(set);
  }, [platformTab]);

  const filteredPosts = useMemo(() => {
    return posts.filter((p) => {
      if (platformTab !== "all" && p.platform !== platformTab) return false;
      if (filters.status.length && !filters.status.includes(p.status)) return false;
      if (filters.campaign && p.campaign !== filters.campaign) return false;
      if (filters.contentType && p.contentType !== filters.contentType) return false;
      return true;
    });
  }, [posts, platformTab, filters]);

  const postsByDay = useMemo(() => {
    const map = {};
    filteredPosts.forEach((p) => { (map[p.date] = map[p.date] || []).push(p); });
    return map;
  }, [filteredPosts]);

  /* ---- handlers ---- */

  function openNew(date) {
    setIsNewPost(true);
    setEditingPost({
      ...EMPTY_POST,
      id: null,
      platform: platformTab !== "all" ? platformTab : "instagram",
      date: date ? toISODate(date) : toISODate(new Date()),
      contentType: PLATFORM_META[platformTab !== "all" ? platformTab : "instagram"].types[0],
    });
  }

  function openEdit(post) { setIsNewPost(false); setEditingPost(post); }

  function closeEditor() { setEditingPost(null); }

  function handleSave(form) {
    if (isNewPost) {
      const newPost = { ...form, id: "p" + Math.random().toString(36).slice(2, 9), order: (postsByDay[form.date]?.length || 0) };
      setPosts((ps) => [...ps, newPost]);
      pushToast("Content added to planner");
    } else {
      setPosts((ps) => ps.map((p) => (p.id === form.id ? form : p)));
      pushToast("Changes saved");
    }
    if (form.campaign && !campaigns.includes(form.campaign)) setCampaigns((c) => [...c, form.campaign]);
    setEditingPost(null);
  }

  function handleDuplicate(post) {
    const copy = { ...post, id: "p" + Math.random().toString(36).slice(2, 9), title: post.title + " (copy)", status: "idea" };
    setPosts((ps) => [...ps, copy]);
    pushToast("Content duplicated");
    setEditingPost(null);
  }

  function handleDeleteRequest(post) { setDeleteTarget(post); }
  function confirmDelete() {
    setPosts((ps) => ps.filter((p) => p.id !== deleteTarget.id));
    pushToast("Content deleted");
    setDeleteTarget(null);
    if (editingPost && editingPost.id === deleteTarget.id) setEditingPost(null);
  }

  function onDropWithId(date, targetPostId, draggedId) {
    if (!draggedId) return;
    setPosts((ps) => {
      const dateKey = toISODate(date);
      const dragged = ps.find((p) => p.id === draggedId);
      if (!dragged) return ps;
      let next = ps.filter((p) => p.id !== draggedId);
      const dayPosts = next.filter((p) => p.date === dateKey).sort((a, b) => a.order - b.order);
      let insertIndex = dayPosts.length;
      if (targetPostId) {
        const idx = dayPosts.findIndex((p) => p.id === targetPostId);
        if (idx !== -1) insertIndex = idx;
      }
      dayPosts.splice(insertIndex, 0, { ...dragged, date: dateKey });
      dayPosts.forEach((p, i) => (p.order = i));
      const others = next.filter((p) => p.date !== dateKey);
      return [...others, ...dayPosts];
    });
    pushToast("Content rescheduled");
  }

  function clearFilters() {
    setFilters({ status: [], campaign: "", contentType: "" });
    setPlatformTab("all");
  }

  const hasActiveFilters = filters.status.length > 0 || filters.campaign || filters.contentType || platformTab !== "all";

  return (
    <div className="h-screen flex flex-col bg-paper text-ink">
      <TopNav view={view} setView={setView} onNewContent={() => openNew(null)} />

      {view === "planner" && (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-4 border-b border-border bg-surface">
            <PlatformTabs active={platformTab} onChange={setPlatformTab} />
            <div className="flex items-center gap-3">
              <DateNav mode={calMode} anchorDate={anchorDate} setAnchorDate={setAnchorDate} />
              <ViewToggle mode={calMode} setMode={setCalMode} />
            </div>
          </div>
          <FilterBar filters={filters} setFilters={setFilters} campaigns={campaigns} contentTypeOptions={contentTypeOptions} resultCount={filteredPosts.length} totalCount={posts.length} />

          {loadError ? (
            <EmptyState title="Couldn't load your planner" message="Something went wrong while loading your content. Try refreshing the page." />
          ) : loading ? (
            <PlannerSkeleton />
          ) : filteredPosts.length === 0 && hasActiveFilters ? (
            <EmptyState title="No content matches these filters" message="Try widening your filters, or create a new post to get started." actionLabel="Clear filters" onAction={clearFilters} />
          ) : (
            <CalendarGridWrapper
              mode={calMode}
              anchorDate={anchorDate}
              postsByDay={postsByDay}
              onDropWithId={onDropWithId}
              onEdit={openEdit}
              onDuplicate={handleDuplicate}
              onDelete={handleDeleteRequest}
              onQuickAdd={openNew}
            />
          )}
        </div>
      )}

      {view === "content" && (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="flex flex-wrap items-center justify-between gap-3 px-6 py-4 border-b border-border bg-surface">
            <PlatformTabs active={platformTab} onChange={setPlatformTab} />
          </div>
          <FilterBar filters={filters} setFilters={setFilters} campaigns={campaigns} contentTypeOptions={contentTypeOptions} resultCount={filteredPosts.length} totalCount={posts.length} />
          {loading ? (
            <div className="flex-1 flex items-center justify-center text-muted text-[13.5px]">Loading content\u2026</div>
          ) : (
            <ContentListView posts={filteredPosts} onEdit={openEdit} onDuplicate={handleDuplicate} onDelete={handleDeleteRequest} onClearFilters={clearFilters} hasFilters={hasActiveFilters} />
          )}
        </div>
      )}

      {view === "analytics" && (loading ? <div className="flex-1 flex items-center justify-center text-muted text-[13.5px]">Loading analytics\u2026</div> : <AnalyticsView posts={posts} />)}

      {view === "settings" && <SettingsView campaigns={campaigns} setCampaigns={setCampaigns} onResetData={() => { setPosts(seedPosts()); setCampaigns(CAMPAIGNS_DEFAULT); pushToast("Planner reset to sample data"); }} />}

      {editingPost && (
        <EditorPanel
          post={editingPost}
          campaigns={campaigns}
          isNew={isNewPost}
          onSave={handleSave}
          onClose={closeEditor}
          onDelete={handleDeleteRequest}
          onDuplicate={handleDuplicate}
        />
      )}

      {deleteTarget && (
        <ConfirmDialog
          title="Delete this content?"
          message={`\u201c${deleteTarget.title}\u201d will be permanently removed from your planner.`}
          confirmLabel="Delete"
          onConfirm={confirmDelete}
          onCancel={() => setDeleteTarget(null)}
        />
      )}

      <Toast toasts={toasts} />
    </div>
  );
}

/* Wrapper so CalendarGrid's internal drag state can call back with the dragged id */
function CalendarGridWrapper(props) {
  const { onDropWithId, ...rest } = props;
  return <CalendarGridInner {...rest} onDropWithId={onDropWithId} />;
}

function CalendarGridInner({ mode, anchorDate, postsByDay, onDropWithId, onEdit, onDuplicate, onDelete, onQuickAdd }) {
  return (
    <CalendarGrid
      mode={mode}
      anchorDate={anchorDate}
      postsByDay={postsByDay}
      onDrop={(date, targetId, draggedId) => onDropWithId(date, targetId, draggedId)}
      onEdit={onEdit}
      onDuplicate={onDuplicate}
      onDelete={onDelete}
      onQuickAdd={onQuickAdd}
    />
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
</html>
